<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港新聞 - Apple Style News Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-content">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h1 class="dashboard-title">香港最新消息</h1>
                <div id="last-update"></div>
            </div>
            
            <div class="categories">
                <button class="nav-link active" data-category="熱門">全部新聞</button>
                <button class="nav-link" data-category="科技">科技新聞</button>
                <button class="nav-link" data-category="商業">商業新聞</button>
                <button class="nav-link" data-category="體育">體育新聞</button>
            </div>

            <div id="news-container" class="news-grid">
                <!-- News items will be inserted here -->
            </div>
        </div>
    </main>

    <script>
        const newsContainer = document.getElementById('news-container');
        const lastUpdateElement = document.getElementById('last-update');
        
        let currentCategory = '熱門';

        async function fetchNews() {
            try {
                const query = currentCategory === '熱門' 
                    ? 'Hong Kong'
                    : `Hong Kong ${currentCategory}`;

                const response = await fetch('https://api.allorigins.win/get?url=' + 
                    encodeURIComponent('https://newsapi.org/v2/everything?' + 
                        new URLSearchParams({
                            q: query,
                            language: 'zh',
                            sortBy: 'publishedAt',
                            pageSize: 12,
                            apiKey: '12d6eec96dbc482785989e57cef3e976'
                        }).toString()
                    )
                );
                
                if (!response.ok) {
                    throw new Error('網路連線失敗');
                }
                
                const rawData = await response.json();
                if (!rawData.contents) {
                    throw new Error('無法取得新聞內容');
                }
                
                const data = JSON.parse(rawData.contents);
                if (data.status === 'error') {
                    throw new Error(data.message || '新聞系統發生錯誤');
                }
                
                if (!data.articles || data.articles.length === 0) {
                    throw new Error('目前沒有相關新聞');
                }
                
                return data.articles;
            } catch (error) {
                console.error('Error details:', error);
                throw new Error(`新聞獲取失敗: ${error.message}`);
            }
        }

        function updateLastUpdateTime() {
            const now = new Date();
            lastUpdateElement.textContent = `最後更新: ${now.toLocaleString('zh-HK')}`;
        }

        function displayNews(articles) {
            if (!articles || articles.length === 0) {
                newsContainer.innerHTML = '<div class="error">暫時沒有可用的新聞</div>';
                return;
            }

            newsContainer.innerHTML = articles.map(article => `
                <div class="news-item">
                    <h2>${article.title}</h2>
                    ${article.description ? `<p>${article.description}</p>` : ''}
                    <div class="source">
                        來源: ${article.source.name || '未知'} |
                        <a href="${article.url}" target="_blank" rel="noopener noreferrer">查看完整內容</a>
                    </div>
                </div>
            `).join('');
        }

        async function updateNews() {
            try {
                newsContainer.innerHTML = '<div class="loading">載入中...</div>';
                const articles = await fetchNews();
                displayNews(articles);
                updateLastUpdateTime();
            } catch (error) {
                newsContainer.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        // Category selection
        document.querySelector('.categories').addEventListener('click', async (e) => {
            const button = e.target.closest('.nav-link');
            if (!button || button.classList.contains('active')) return;

            document.querySelector('.nav-link.active').classList.remove('active');
            button.classList.add('active');

            currentCategory = button.dataset.category;
            await updateNews();
        });

        // Initial load
        updateNews();

        // Update every hour
        setInterval(updateNews, 3600000);

        // Add smooth scroll for categories
        const categoriesContainer = document.querySelector('.categories');
        let isScrolling = false;

        categoriesContainer.addEventListener('wheel', (e) => {
            if (!isScrolling) {
                requestAnimationFrame(() => {
                    categoriesContainer.scrollLeft += e.deltaY;
                    isScrolling = false;
                });
                isScrolling = true;
            }
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
